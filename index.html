<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الرصيد - حميدا</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#17191b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حميدا">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* دفتر بسيط لحميدا: رصيد كبير فوق، زر إضافة، وقائمة حركات، مع تخزين محلي كامل للعمل دون اتصال */
:root{
  --bg:#17191b; --surface:#1f2226; --surface-2:#262a2e; --border:#2d3135;
  --fg:#ece9e3; --fg-muted:#9a9e9f; --fg-faint:#6c7074;
  --accent:#dd9a43; --accent-soft:#3a2f1e;
  --good:#4caf7d; --good-soft:#1c2c24;
  --bad:#e2604f; --bad-soft:#331e1a;
  --font-display:'Cairo',system-ui,sans-serif;
  --font-body:'Tajawal',system-ui,sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f2ec; --surface:#ffffff; --surface-2:#f0ebe1; --border:#e2dccf;
    --fg:#211f1c; --fg-muted:#6b655c; --fg-faint:#8c867b;
    --accent:#b8711f; --accent-soft:#f3e3cc;
    --good:#2f8f5b; --good-soft:#e3f1e9;
    --bad:#c23f2e; --bad-soft:#f6e0dd;
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f2ec; --surface:#ffffff; --surface-2:#f0ebe1; --border:#e2dccf;
  --fg:#211f1c; --fg-muted:#6b655c; --fg-faint:#8c867b;
  --accent:#b8711f; --accent-soft:#f3e3cc;
  --good:#2f8f5b; --good-soft:#e3f1e9;
  --bad:#c23f2e; --bad-soft:#f6e0dd;
  color-scheme: light;
}
*{box-sizing:border-box}
body{ background:var(--bg); color:var(--fg); margin:0; font-family:var(--font-body); direction:rtl; text-align:right; font-variant-numeric:tabular-nums; }
[hidden]{ display:none !important; }
.wrap{ max-width:480px; margin:0 auto; padding-inline:16px; padding-block:24px 48px; display:flex; flex-direction:column; gap:18px; }

.title{ font-family:var(--font-display); font-weight:800; font-size:1.3rem; text-align:center; }

.balanceCard{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:28px 20px; text-align:center; display:flex; flex-direction:column; gap:6px; }
.balanceCard .label{ color:var(--fg-muted); font-size:.85rem; }
.balanceCard .value{ font-family:var(--font-display); font-weight:800; font-size:2.4rem; }
.balanceCard .value.good{ color:var(--good); }
.balanceCard .value.bad{ color:var(--bad); }
.balanceCard .sub{ color:var(--fg-faint); font-size:.78rem; }

.syncLabel{ text-align:center; font-size:.72rem; color:var(--fg-faint); }

.totalsRow{ display:flex; justify-content:center; gap:18px; font-size:.78rem; color:var(--fg-muted); }
.totalsRow b{ font-family:var(--font-display); font-weight:700; }
.totalsRow .inTot b{ color:var(--good); }
.totalsRow .outTot b{ color:var(--bad); }

.versionFooter{ text-align:center; font-size:.68rem; color:var(--fg-faint); opacity:.6; margin-top:6px; }

.addBtn{ font-family:var(--font-body); font-weight:700; font-size:1rem; color:#17191b; background:var(--accent); border:none; border-radius:16px; padding:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
.addBtn:disabled{ opacity:.5; cursor:default; }

.printBtn{ font-family:var(--font-body); font-weight:700; font-size:.88rem; color:var(--fg); background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
.printBtn:disabled{ opacity:.5; cursor:default; }

.formCard{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px; }
.segmented{ display:flex; background:var(--surface-2); border-radius:12px; padding:4px; gap:4px; }
.segmented button{ flex:1; border:none; background:transparent; font-family:var(--font-body); font-weight:700; font-size:.9rem; padding:10px; border-radius:9px; cursor:pointer; color:var(--fg-muted); }
#typeInBtn{ color:var(--good); }
#typeInBtn.active{ background:var(--good); color:#ffffff; }
#typeOutBtn{ color:var(--bad); }
#typeOutBtn.active{ background:var(--bad); color:#ffffff; }
.formRow label{ font-size:.8rem; color:var(--fg-muted); font-weight:700; display:block; margin-bottom:4px; }
.formRow input{ width:100%; font-family:var(--font-body); font-size:1rem; color:var(--fg); background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 12px; }
.formRow input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.formActions{ display:flex; gap:10px; }
.btn{ flex:1; font-family:var(--font-body); font-weight:700; font-size:.92rem; border-radius:12px; padding:12px; cursor:pointer; border:1px solid var(--border); background:var(--surface-2); color:var(--fg); }
.btn.primary{ background:var(--accent); color:#17191b; border-color:transparent; }
.btn:disabled{ opacity:.6; cursor:default; }

.sectionRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px; }
.sectionLabel{ color:var(--fg-muted); font-size:.82rem; font-weight:700; }
.printLink{ font-family:var(--font-body); font-weight:600; font-size:.72rem; color:var(--fg-faint); background:none; border:none; padding:4px 2px; cursor:pointer; display:flex; align-items:center; gap:4px; }
.printLink:hover{ color:var(--fg-muted); }

.entryList{ display:flex; flex-direction:column; gap:14px; }

.monthGroup{ display:flex; flex-direction:column; gap:8px; }
.groupHeader{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; background:none; border:none; padding:6px 2px; cursor:pointer; font-family:var(--font-body); color:var(--fg); text-align:right; }
.groupHeader .glabel{ font-weight:700; font-size:.95rem; }
.groupHeader.weekHeader .glabel{ font-weight:600; font-size:.84rem; color:var(--fg-muted); }
.groupHeader .gright{ display:flex; align-items:center; gap:8px; }
.groupHeader .gtotal{ font-size:.72rem; color:var(--fg-faint); }
.groupHeader .chevron{ font-size:.7rem; color:var(--fg-faint); transition:transform .15s; }
.groupHeader[data-open="1"] .chevron{ transform:rotate(90deg); }
.weekGroup{ display:flex; flex-direction:column; gap:7px; margin-inline-start:6px; }
.groupBody{ display:flex; flex-direction:column; gap:8px; }
.groupBody[hidden]{ display:none; }

.entry{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:default; }
.entry.editable{ cursor:pointer; }
.entry.editable:active{ background:var(--surface-2); }
.entry.cancelled{ opacity:.55; }
.entry .info{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.entry .info .desc{ font-weight:600; font-size:.92rem; }
.entry.cancelled .info .desc{ text-decoration:line-through; }
.entry .info .date{ font-size:.74rem; color:var(--fg-faint); }
.entry .right{ display:flex; align-items:center; gap:10px; flex:none; }
.entry .amt{ font-family:var(--font-display); font-weight:700; font-size:1rem; white-space:nowrap; }
.entry .amt.in{ color:var(--good); }
.entry .amt.out{ color:var(--bad); }
.entry .tag{ font-size:.68rem; font-weight:700; border-radius:999px; padding:2px 8px; }
.entry .tag.cancelledTag{ background:var(--bad-soft); color:var(--bad); }
.entry .tag.pendingTag{ background:var(--accent-soft); color:var(--accent); }
.cancelBtn{ background:none; border:1px solid var(--border); color:var(--fg-muted); border-radius:9px; padding:6px 10px; font-size:.76rem; font-family:var(--font-body); cursor:pointer; white-space:nowrap; }
.cancelBtn.undo{ color:var(--accent); border-color:var(--accent); }

.emptyState{ text-align:center; color:var(--fg-muted); font-size:.88rem; padding:30px 10px; background:var(--surface); border:1px dashed var(--border); border-radius:14px; }
.statusMsg{ font-size:.82rem; border-radius:10px; padding:10px 14px; text-align:center; }
.statusMsg.error{ background:var(--bad-soft); color:var(--bad); }
.statusMsg.info{ background:var(--surface-2); color:var(--fg-muted); }
.statusMsg[hidden]{ display:none; }

.lockOverlay{ position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; align-items:center; justify-content:center; padding:20px; }
.lockBox{ width:100%; max-width:320px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:30px 24px; display:flex; flex-direction:column; gap:14px; text-align:center; }
.lockTitle{ font-family:var(--font-display); font-weight:800; font-size:1.15rem; }
.lockBox input{ width:100%; font-family:var(--font-body); font-size:1.1rem; text-align:center; color:var(--fg); background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:13px 12px; letter-spacing:2px; }
.lockBox input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.lockMsg{ color:var(--bad); font-size:.82rem; }
.lockMsg[hidden]{ display:none; }
</style>
</head>
<body>
<div class="lockOverlay" id="lockOverlay" hidden>
  <div class="lockBox">
    <div class="lockTitle">🔒 الرصيد - حميدا</div>
    <input type="password" id="lockInput" placeholder="كلمة السر" inputmode="numeric" autocomplete="off">
    <button class="btn primary" id="lockBtn" type="button">دخول</button>
    <div class="lockMsg" id="lockMsg" hidden>كلمة السر غير صحيحة</div>
  </div>
</div>
<div class="wrap">
  <div class="title">الرصيد - حميدا</div>

  <div class="balanceCard">
    <span class="label">الرصيد الحالي</span>
    <span class="value" id="balanceValue">—</span>
    <span class="sub" id="balanceSub">جارٍ التحميل</span>
  </div>

  <div class="totalsRow">
    <span class="inTot">إجمالي وارد: <b id="totalInValue">—</b></span>
    <span class="outTot">إجمالي ناقص: <b id="totalOutValue">—</b></span>
  </div>

  <div class="syncLabel" id="syncLabel">—</div>

  <span id="statusMsg" class="statusMsg info" hidden></span>

  <button class="addBtn" id="openFormBtn" type="button">+ إضافة حركة جديدة</button>
  <button class="printBtn" id="installBtn" type="button" hidden>⬇️ تثبيت التطبيق على الشاشة الرئيسية</button>

  <div class="formCard" id="formCard" hidden>
    <div class="segmented">
      <button type="button" class="active" data-type="in" id="typeInBtn">وارد</button>
      <button type="button" data-type="out" id="typeOutBtn">ناقص</button>
    </div>
    <div class="formRow">
      <label>المبلغ (₪)</label>
      <input type="number" step="0.01" id="amtInput" placeholder="مثال: 300">
    </div>
    <div class="formRow">
      <label>البيان</label>
      <input type="text" id="descInput" placeholder="مثال: نقل">
    </div>
    <div class="formRow">
      <label>التاريخ</label>
      <input type="date" id="dateInput">
    </div>
    <div class="formActions">
      <button class="btn primary" id="saveBtn" type="button">حفظ</button>
      <button class="btn" id="cancelFormBtn" type="button">إلغاء</button>
    </div>
  </div>

  <div class="sectionRow">
    <div class="sectionLabel">الحركات</div>
    <button class="printLink" id="printBtn" type="button">🖨️ طباعة كشف حساب</button>
  </div>
  <div class="entryList" id="entryList">
    <div class="emptyState">جارٍ التحميل</div>
  </div>

  <div class="versionFooter" id="versionFooter"></div>
</div>

<script>
(function(){
  // ====== إعدادات المزامنة ======
  // رابط تطبيق الويب الخاص بـ Google Apps Script (يملأه صاحب العمل بعد نشر السكربت مرة واحدة).
  // طالما الحقل فاضي، التطبيق يعمل بالكامل محليًا بدون أي مزامنة مع الشيت.
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxf84IaLsStuqhO3OJ-mGoXUKo9z4Xo1Zv1wfyfPVHRyufbecfGKC0yXq28PC4mOrZU/exec';
  // كلمة مرور بسيطة مشتركة مع السكربت، لمنع أي طرف عشوائي من الكتابة على الرابط لو تسرّب.
  var SYNC_SECRET = '0592943185';
  var APP_VERSION = '1.4.0';
  // ====== نهاية الإعدادات ======

  var CACHE_KEY  = 'hamida_entries_v1';
  var QUEUE_KEY  = 'hamida_pending_queue_v1';
  var DELQ_KEY   = 'hamida_delete_queue_v1';
  var EDITQ_KEY  = 'hamida_edit_queue_v1';
  var SYNC_KEY   = 'hamida_last_sync_v1';
  var PULL_INTERVAL_MS = 5 * 60 * 1000; // سحب دوري من الشيت كل 5 دقائق أثناء فتح الصفحة

  var allEntries   = []; // كل الحركات المحفوظة محليًا: [{id,type,amount,desc,date,cancelled,createdAt,syncedToSheet,sheetRow}]
  var pendingQueue = []; // معرفات حركات لم تُرسَل للشيت بعد: [id,...]
  var deleteQueue  = []; // أرقام صفوف بالشيت يجب تفريغها ولم يُؤكَّد ذلك بعد: [row,...]
  var editQueue    = []; // أرقام صفوف بالشيت تحتاج تحديث بياناتها الحالية (من allEntries) ولم يُؤكَّد ذلك بعد: [row,...]
  var lastSyncAt   = null;
  var syncing      = false;
  var pulling      = false;
  var editingId    = null; // id الحركة التي يفتح النموذج الآن لتعديلها (null يعني وضع "إضافة جديدة")
  var expandedGroups = {}; // مفاتيح الشهر/الأسبوع المفتوحة حاليًا بالعرض: {key: true}

  function safeGet(key){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  }
  function safeSet(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }

  function fmt(n){
    if(!isFinite(n)) n=0;
    return (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
  }
  function pad(n){ return String(n).padStart(2,'0'); }
  function todayLabel(){
    var d = new Date();
    return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
  }
  function todayInputValue(){
    var d = new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function inputDateToLabel(v){
    var parts = String(v||'').split('-');
    if(parts.length!==3) return todayLabel();
    return pad(+parts[2])+'/'+pad(+parts[1])+'/'+parts[0];
  }
  function makeLocalId(){
    return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }
  var AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function parseDateLabel(label){
    var parts = String(label||'').split('/');
    if(parts.length!==3) return null;
    var d = new Date(+parts[2], +parts[1]-1, +parts[0]);
    return isNaN(d.getTime()) ? null : d;
  }
  function monthKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
  function monthLabel(d){ return AR_MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  // الأسبوع من الجمعة للخميس: نرجع لأقرب جمعة سابقة (أو نفس اليوم لو هو جمعة)
  function weekStart(d){
    var day = d.getDay(); // 0=أحد...5=جمعة,6=سبت
    var diff = (day - 5 + 7) % 7;
    var ws = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diff);
    return ws;
  }
  function weekKey(d){ var ws = weekStart(d); return ws.getFullYear()+'-'+pad(ws.getMonth()+1)+'-'+pad(ws.getDate()); }
  function weekLabel(d){
    var ws = weekStart(d);
    var we = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate()+6);
    return pad(ws.getDate())+'/'+pad(ws.getMonth()+1)+' - '+pad(we.getDate())+'/'+pad(we.getMonth()+1);
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function showStatus(text, cls){
    var el = document.getElementById('statusMsg');
    el.hidden = false; el.textContent = text; el.className = 'statusMsg ' + (cls||'info');
  }
  function hideStatus(){ document.getElementById('statusMsg').hidden = true; }

  function formatSyncLabel(){
    if(!APPS_SCRIPT_URL) return 'المزامنة مع الشيت غير مفعّلة بعد (التسجيل يعمل محليًا فقط)';
    if(!lastSyncAt) return 'لم تتم المزامنة مع الشيت بعد';
    var d = new Date(lastSyncAt);
    return 'آخر مزامنة: ' + pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear() + ' - ' + pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function renderSyncLabel(){
    document.getElementById('syncLabel').textContent = formatSyncLabel() + (pendingQueue.length ? ' · بانتظار المزامنة: ' + pendingQueue.length : '');
  }

  function visibleEntries(){
    return allEntries.slice().sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
  }

  function renderBalance(){
    var bal = allEntries.reduce(function(sum, e){
      if(e.cancelled) return sum;
      return sum + (e.type==='in' ? e.amount : -e.amount);
    }, 0);
    var el = document.getElementById('balanceValue');
    el.textContent = (bal<0?'−':'') + fmt(Math.abs(bal)) + ' ₪';
    el.className = 'value ' + (bal>=0 ? 'good' : 'bad');
    document.getElementById('balanceSub').textContent = bal>=0 ? 'رصيد له' : 'رصيد عليه';
  }

  function renderTotals(){
    var totalIn = 0, totalOut = 0;
    allEntries.forEach(function(e){
      if(e.cancelled) return;
      if(e.type==='in') totalIn += e.amount; else totalOut += e.amount;
    });
    document.getElementById('totalInValue').textContent = fmt(totalIn) + ' ₪';
    document.getElementById('totalOutValue').textContent = fmt(totalOut) + ' ₪';
  }

  function netTotal(list){
    return list.reduce(function(sum, e){
      if(e.cancelled) return sum;
      return sum + (e.type==='in' ? e.amount : -e.amount);
    }, 0);
  }
  function fmtNet(n){
    return (n<0?'−':'+') + fmt(Math.abs(n)) + ' ₪';
  }

  function entryRowHtml(e, today){
    var sign = e.type==='in' ? '+' : '−';
    var tags = '';
    if(e.cancelled) tags += '<span class="tag cancelledTag">ملغي</span>';
    else if(APPS_SCRIPT_URL && !e.syncedToSheet) tags += '<span class="tag pendingTag">بانتظار المزامنة</span>';
    var isToday = e.date === today;
    return '<div class="entry '+(e.cancelled?'cancelled':'')+(isToday?' editable':'')+'" data-id="'+e.id+'" data-editable="'+(isToday?'1':'0')+'">'+
      '<div class="info"><span class="desc">'+escapeHtml(e.desc)+'</span><span class="date">'+escapeHtml(e.date)+'</span></div>'+
      '<div class="right">'+
        tags+
        '<span class="amt '+(e.type==='in'?'in':'out')+'">'+sign+fmt(e.amount)+' ₪</span>'+
        (isToday ? '<button class="cancelBtn" data-action="delete" data-id="'+e.id+'">حذف</button>' : '')+
      '</div>'+
    '</div>';
  }

  // يبني العرض مجمّعًا بالشهر فقط، كل شهر قابل للطي/الفتح مع إجمالي صغير فوقه.
  // الشهر الحالي مفتوح افتراضيًا، وما عداه مطوي، إلا لو المستخدم فتحه يدويًا بهذه الزيارة.
  function renderList(){
    var list = document.getElementById('entryList');
    var view = visibleEntries();
    if(!view.length){
      list.innerHTML = '<div class="emptyState">لا توجد حركات مسجّلة حتى الآن. اضغط زر «إضافة حركة جديدة» أعلى الصفحة.</div>';
      return;
    }
    var today = todayLabel();
    var now = new Date();
    var curMonthKey = monthKey(now);

    var months = {}; // key -> {label, sortDate, entries:[]}
    var monthOrder = [];
    view.forEach(function(e){
      var d = parseDateLabel(e.date) || now;
      var mk = monthKey(d), ml = monthLabel(d);
      if(!months[mk]){ months[mk] = { label: ml, sortDate: d, entries: [] }; monthOrder.push(mk); }
      months[mk].entries.push(e);
    });
    monthOrder.sort(function(a,b){ return months[b].sortDate - months[a].sortDate; });

    var html = monthOrder.map(function(mk){
      var mg = months[mk];
      var monthOpen = Object.prototype.hasOwnProperty.call(expandedGroups, 'm:'+mk) ? expandedGroups['m:'+mk] : (mk === curMonthKey);
      var entriesHtml = mg.entries.map(function(e){ return entryRowHtml(e, today); }).join('');
      return '<div class="monthGroup">'+
        '<button type="button" class="groupHeader" data-toggle="m:'+mk+'" data-open="'+(monthOpen?'1':'0')+'">'+
          '<span class="glabel">'+mg.label+'</span>'+
          '<span class="gright"><span class="gtotal">'+fmtNet(netTotal(mg.entries))+'</span><span class="chevron">›</span></span>'+
        '</button>'+
        '<div class="groupBody" '+(monthOpen?'':'hidden')+'>'+entriesHtml+'</div>'+
      '</div>';
    }).join('');

    list.innerHTML = html;
  }

  function renderAll(){
    renderBalance();
    renderTotals();
    renderList();
    renderSyncLabel();
  }

  function persist(){
    safeSet(CACHE_KEY, allEntries);
    safeSet(QUEUE_KEY, pendingQueue);
    safeSet(DELQ_KEY, deleteQueue);
    safeSet(EDITQ_KEY, editQueue);
  }

  // يرسل الحركات المعلّقة (غير الملغاة) إلى شيت جوجل عبر Apps Script، حركة بحركة،
  // ويتوقف عند أول فشل ليُستكمل لاحقًا (مثلًا عند عودة الاتصال)
  async function trySync(){
    if(syncing || !APPS_SCRIPT_URL || !navigator.onLine) return;
    syncing = true;
    try{
      while(pendingQueue.length){
        var id = pendingQueue[0];
        var entry = allEntries.find(function(e){ return e.id===id; });
        if(!entry){ pendingQueue.shift(); persist(); continue; }
        if(entry.cancelled){ pendingQueue.shift(); persist(); continue; } // أُلغيت قبل أن تُرسَل: لا تُرسَل أبدًا
        try{
          var res = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // يتجنّب preflight CORS مع Apps Script
            body: JSON.stringify({
              secret: SYNC_SECRET,
              type: entry.type,
              amount: entry.amount,
              desc: entry.desc,
              date: entry.date
            })
          });
          if(!res.ok) throw new Error('bad status');
          var data = await res.json().catch(function(){ return {}; });
          if(data && data.ok === false) throw new Error(data.error || 'rejected');
          entry.syncedToSheet = true;
          if(data && data.row) entry.sheetRow = data.row; // يمنع ظهورها كتكرار لاحقًا عند السحب من الشيت
          pendingQueue.shift();
          persist();
        }catch(err){
          break; // فشل الإرسال (غالبًا بسبب الشبكة): نوقف المحاولة، تُستكمل بالمحاولة القادمة
        }
      }
      // طابور التعديل: صفوف بالشيت تحتاج تحديث بياناتها الحالية (حركات اليوم المعدَّلة بعد ما كانت تزامنت)
      while(APPS_SCRIPT_URL && navigator.onLine && editQueue.length){
        var erow = editQueue[0];
        var eentry = allEntries.find(function(x){ return x.sheetRow === erow; });
        if(!eentry){ editQueue.shift(); persist(); continue; }
        try{
          var eres = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              secret: SYNC_SECRET, action: 'update', row: erow,
              type: eentry.type, amount: eentry.amount, desc: eentry.desc, date: eentry.date
            })
          });
          if(!eres.ok) throw new Error('bad status');
          var edata = await eres.json().catch(function(){ return {}; });
          if(edata && edata.ok === false) throw new Error(edata.error || 'rejected');
          editQueue.shift();
          persist();
        }catch(err){
          break;
        }
      }
      // طابور الحذف: صفوف بالشيت يجب تفريغها (حركات اليوم المحذوفة من التطبيق بعد ما كانت تزامنت)
      while(APPS_SCRIPT_URL && navigator.onLine && deleteQueue.length){
        var row = deleteQueue[0];
        try{
          await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ secret: SYNC_SECRET, action: 'delete', row: row })
          });
          deleteQueue.shift();
          persist();
        }catch(err){
          break;
        }
      }
      lastSyncAt = Date.now();
      safeSet(SYNC_KEY, lastSyncAt);
      renderAll();
    } finally {
      syncing = false;
    }
  }

  // يسحب كل حركات الشيت (المضافة أو المعدَّلة أو المحذوفة من أي جهاز، بما فيه هذا الجهاز نفسه)
  // ويطابقها بالكامل مع ما هو محفوظ محليًا: يحدّث الحركات المعدَّلة بالشيت، ويحذف محليًا أي حركة
  // زالت من الشيت، ويضيف أي حركة جديدة — فتعرض كل الأجهزة دائمًا نفس البيانات الموحّدة من الشيت
  async function pullFromSheet(){
    if(pulling || !APPS_SCRIPT_URL || !navigator.onLine) return;
    pulling = true;
    try{
      var url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf('?')===-1 ? '?' : '&') + 'secret=' + encodeURIComponent(SYNC_SECRET);
      var res = await fetch(url, { method: 'GET' });
      if(!res.ok) return;
      var data = await res.json().catch(function(){ return {}; });
      if(!data || data.ok === false || !Array.isArray(data.entries)) return;

      var remoteByRow = {};
      data.entries.forEach(function(re){ remoteByRow[re.row] = re; });

      var changed = false;

      // 1) الحركات اللي أصلها من الشيت (عندها sheetRow): نحدّثها لو تغيّرت، أو نحذفها محليًا لو زالت من الشيت
      allEntries = allEntries.filter(function(e){
        if(!e.sheetRow) return true; // حركة محلية بحتة (لسا ما انبعثت): نخليها بحالها
        var re = remoteByRow[e.sheetRow];
        delete remoteByRow[e.sheetRow]; // نعلّمها كمُعالَجة (سواء وُجدت أو لا)
        if(!re) { changed = true; return false; } // زالت من الشيت: نحذفها محليًا أيضًا
        if(e.type !== re.type || e.amount !== Number(re.amount) || e.desc !== re.desc || e.date !== re.date){
          e.type = re.type === 'in' ? 'in' : 'out';
          e.amount = Number(re.amount) || 0;
          e.desc = re.desc || '';
          e.date = re.date || '';
          changed = true;
        }
        e.syncedToSheet = true;
        return true;
      });

      // 2) أي حركات تبقّت بالشيت ولا نعرفها محليًا: حركات جديدة أُضيفت من جهاز تاني
      Object.keys(remoteByRow).forEach(function(rowKey){
        var re = remoteByRow[rowKey];
        allEntries.push({
          id: 'sheetRow_' + re.row,
          type: re.type === 'in' ? 'in' : 'out',
          amount: Number(re.amount) || 0,
          desc: re.desc || '',
          date: re.date || '',
          cancelled: false,
          createdAt: re.row, // ترتيب تقريبي يطابق ترتيب الصفوف في الشيت
          syncedToSheet: true,
          sheetRow: re.row
        });
        changed = true;
      });

      if(changed){
        fixBadDates();
        persist();
        renderAll();
      }
      lastSyncAt = Date.now();
      safeSet(SYNC_KEY, lastSyncAt);
      renderSyncLabel();
    } catch(err){
      // فشل الشبكة أو غيره: نتجاهل بصمت، ستُعاد المحاولة بالجولة القادمة
    } finally {
      pulling = false;
    }
  }

  function queueForSync(id){
    if(!APPS_SCRIPT_URL) return;
    if(pendingQueue.indexOf(id) === -1) pendingQueue.push(id);
    persist();
    trySync();
  }

  // حذف حقيقي (مو إلغاء) مقتصر على حركات اليوم فقط؛ أي حركة أقدم تُعدَّل من الشيت مباشرة فقط،
  // والتطبيق بيعكس هذا التعديل تلقائيًا بالمزامنة القادمة (عبر pullFromSheet بالأعلى)
  function deleteEntry(id){
    var idx = allEntries.findIndex(function(e){ return e.id===id; });
    if(idx===-1) return;
    var e = allEntries[idx];
    if(e.date !== todayLabel()){
      showStatus('ما بينحذف إلا حركات اليوم من هنا. أي حركة أقدم عدّلها مباشرة بالشيت، والتطبيق بيحدّث نفسه تلقائيًا.', 'error');
      return;
    }
    allEntries.splice(idx, 1);
    var qIdx = pendingQueue.indexOf(id);
    if(qIdx !== -1) pendingQueue.splice(qIdx, 1);
    if(e.sheetRow){
      var eqIdx = editQueue.indexOf(e.sheetRow);
      if(eqIdx !== -1) editQueue.splice(eqIdx, 1); // تعديل معلّق على نفس الحركة صار بلا فائدة بعد حذفها
      if(deleteQueue.indexOf(e.sheetRow) === -1) deleteQueue.push(e.sheetRow);
    }
    persist();
    renderAll();
    trySync();
  }

  function resetForm(){
    editingId = null;
    document.getElementById('amtInput').value = '';
    document.getElementById('descInput').value = '';
    document.getElementById('dateInput').value = todayInputValue();
    document.getElementById('saveBtn').textContent = 'حفظ';
    setType('out');
  }
  function setType(t){
    document.getElementById('typeInBtn').classList.toggle('active', t==='in');
    document.getElementById('typeOutBtn').classList.toggle('active', t==='out');
    document.getElementById('formCard').dataset.type = t;
  }

  // يفتح نفس نموذج الإضافة معبّى ببيانات حركة موجودة لتعديلها؛ مقتصر على حركات اليوم فقط
  // (نفس قيد الحذف)، لأن الحركات الأقدم تُعدَّل من الشيت مباشرة فقط.
  function editEntry(id){
    var e = allEntries.find(function(x){ return x.id===id; });
    if(!e) return;
    if(e.date !== todayLabel()){
      showStatus('ما بينتعدّل إلا حركات اليوم من هنا. أي حركة أقدم عدّلها مباشرة بالشيت.', 'error');
      return;
    }
    editingId = id;
    document.getElementById('amtInput').value = e.amount;
    document.getElementById('descInput').value = e.desc;
    var d = parseDateLabel(e.date) || new Date();
    document.getElementById('dateInput').value = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    setType(e.type);
    document.getElementById('saveBtn').textContent = 'حفظ التعديل';
    document.getElementById('formCard').hidden = false;
    hideStatus();
    document.getElementById('formCard').scrollIntoView({ behavior:'smooth', block:'center' });
  }

  function saveEntry(){
    var amt = parseFloat(document.getElementById('amtInput').value);
    var desc = document.getElementById('descInput').value.trim();
    var type = document.getElementById('formCard').dataset.type || 'out';
    var dateVal = document.getElementById('dateInput').value;
    if(!amt || amt<=0){ showStatus('يجب إدخال المبلغ.', 'error'); return; }
    if(!desc){ showStatus('يجب إدخال البيان، مثل: نقل أو سلفة.', 'error'); return; }
    if(!dateVal){ showStatus('يجب تحديد التاريخ.', 'error'); return; }

    var newDateLabel = inputDateToLabel(dateVal);

    if(editingId){
      var e = allEntries.find(function(x){ return x.id===editingId; });
      var id = editingId;
      if(e){
        e.type = type; e.amount = amt; e.desc = desc; e.date = newDateLabel;
        persist();
        if(e.sheetRow){
          if(editQueue.indexOf(e.sheetRow) === -1) editQueue.push(e.sheetRow);
          persist();
        }
      }
      document.getElementById('formCard').hidden = true;
      resetForm();
      hideStatus();
      renderAll();
      if(e && e.sheetRow) trySync();
      return;
    }

    var newId = makeLocalId();
    allEntries.push({
      id: newId, type: type, amount: amt, desc: desc, date: newDateLabel,
      cancelled: false, createdAt: Date.now(), syncedToSheet: false
    });
    persist();

    document.getElementById('formCard').hidden = true;
    resetForm();
    hideStatus();
    renderAll();

    queueForSync(newId);
  }

  document.getElementById('typeInBtn').addEventListener('click', function(){ setType('in'); });
  document.getElementById('typeOutBtn').addEventListener('click', function(){ setType('out'); });

    document.getElementById('formCard').hidden = false;
    hideStatus();
  });
  document.getElementById('cancelFormBtn').addEventListener('click', function(){

    resetForm();

  document.getElementById('saveBtn').addEventListener('click', saveEntry);
  document.getElementById('entryList').addEventListener('click', function(e){
    var delBtn = e.target.closest('[data-action="delete"]');
    if(delBtn){ deleteEntry(delBtn.dataset.id); return; }

    var toggle = e.target.closest('[data-toggle]');
    if(toggle){
      var key = toggle.dataset.toggle;
      var currentlyOpen = toggle.dataset.open === '1';
      expandedGroups[key] = !currentlyOpen;
      renderList();
      return;
    }

    var row = e.target.closest('.entry[data-editable="1"]');
    if(row) editEntry(row.dataset.id);
  });

  // ينسّق رقمًا بنفس طريقة "General" في الشيت الأساسي: بدون فواصل الآلاف،
  // وبدون نقطة عشرية زائدة للأرقام الصحيحة (يطابق التنسيق المطبّق على الشيت)
  function fmtGeneral(n){
    if(!isFinite(n)) n = 0;
    var v = Math.round(n*100)/100;
    return String(v);
  }

  // يبني كشف حساب مطبوع يعيد إنتاج شكل الشيت الأساسي بالضبط: نفس صفوف الترويسة العلوية
  // (المطبخ / الرصيد / إجمالي وارد وناقص / ترويسة الأعمدة)، ونفس خطوط الجدول وتنسيق الأرقام،
  // بترتيب أعمدة الشيت نفسه (وارد / ناقص / البيان / التاريخ)، في نافذة/تبويب مستقل يُطبَع منه
  function openPrintStatement(){
    var rows = visibleEntries().slice().sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
    var totalIn = 0, totalOut = 0;
    var bodyRows = rows.map(function(e){
      var isIn = e.type === 'in';
      if(!e.cancelled){
        if(isIn) totalIn += e.amount; else totalOut += e.amount;
      }
      var inCell  = isIn ? fmtGeneral(e.amount) : '';
      var outCell = isIn ? '' : fmtGeneral(e.amount);
      var tag = e.cancelled ? ' (ملغي)' : '';
      return '<tr'+(e.cancelled?' class="cancelledRow"':'')+'>'+
        '<td class="num'+(isIn?' inCell':'')+'">'+inCell+'</td>'+
        '<td class="num'+(!isIn?' outCell':'')+'">'+outCell+'</td>'+
        '<td class="desc">'+escapeHtml(e.desc)+tag+'</td>'+
        '<td class="num">'+escapeHtml(e.date)+'</td>'+
      '</tr>';
    }).join('');

    var finalBalance = totalIn - totalOut;
    var now = new Date();
    var stamp = pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear()+' - '+pad(now.getHours())+':'+pad(now.getMinutes());

    var doc = '<!doctype html><html><head><meta charset="utf-8">'+
      '<title>كشف حساب - حميدا</title>'+
      '<style>'+
        'body{ font-family:Arial,"Tajawal",sans-serif; color:#000; background:#fff; direction:rtl; text-align:right; margin:22px; font-size:11pt; }'+
        '.pSub{ font-size:.8rem; color:#555; margin-bottom:12px; text-align:center; }'+
        'table{ width:100%; border-collapse:collapse; font-size:.92rem; }'+
        'td, th{ border:1px solid #999; padding:6px 9px; text-align:center; }'+
        '.num{ text-align:center; }'+
        'td.desc{ text-align:right; }'+
        'tr.colHead th{ font-weight:700; background:#fce5cd; }'+
        'tr.cancelledRow td{ color:#999; text-decoration:line-through; }'+
        'tr.headBlock td{ font-weight:700; }'+
        'tr.headBlock .titleCell{ text-align:center; background:#4fd1dc; }'+
        'tr.headBlock .inTotal{ background:#d9ead3; }'+
        'tr.headBlock .outTotal{ background:#f4cccc; }'+
        'tr.headBlock .blank{ border:1px solid #999; }'+
        'td.inCell{ background:#d9ead3; font-weight:700; }'+
        'td.outCell{ background:#f4cccc; font-weight:700; }'+
        '@media print{ @page{ margin:14mm; } -webkit-print-color-adjust:exact; print-color-adjust:exact; }'+
        '*{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }'+
      '</style></head><body>'+
      '<div class="pSub">كشف حساب - حميدا &nbsp;·&nbsp; تاريخ الطباعة: '+stamp+'</div>'+
      '<table><tbody>'+
        '<tr class="headBlock"><td class="titleCell" colspan="2">المطبخ</td><td class="titleCell" colspan="2">الرصيد</td></tr>'+
        '<tr class="headBlock"><td class="blank" colspan="2"></td><td colspan="2">'+(finalBalance<0?'−':'')+fmtGeneral(Math.abs(finalBalance))+'</td></tr>'+
        '<tr class="headBlock"><td class="inTotal">'+fmtGeneral(totalIn)+'</td><td class="outTotal">'+fmtGeneral(totalOut)+'</td><td class="blank" colspan="2"></td></tr>'+
        '<tr class="colHead"><th>وارد</th><th>ناقص</th><th>البيان</th><th>التاريخ</th></tr>'+
        bodyRows+
      '</tbody></table>'+
      '</body></html>';

    var win = window.open('', '_blank');
    if(!win){
      showStatus('يرجى السماح للموقع بفتح نافذة منبثقة لطباعة كشف الحساب، ثم المحاولة مرة أخرى.', 'error');
      return;
    }
    win.document.open();
    win.document.write(doc);
    win.document.close();
    var didPrint = false;
    function triggerPrint(){
      if(didPrint) return;
      didPrint = true;
      try{ win.focus(); win.print(); }catch(e){}
    }
    win.onload = triggerPrint;
    setTimeout(triggerPrint, 350);
  }

  document.getElementById('printBtn').addEventListener('click', openPrintStatement);

  window.addEventListener('online', function(){ trySync().then(pullFromSheet); });
  // طبقة حماية إضافية: أي رجوع للتطبيق (فتح الجوال، تبديل تطبيقات) يحاول يزامن أيضًا،
  // تحسبًا لأي حالة ما يُطلق فيها حدث "online" بشكل موثوق على بعض الأجهزة
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') trySync().then(pullFromSheet);
  });

  // يصلّح تلقائيًا أي تاريخ محفوظ محليًا بصيغة غلط (مثلًا من نسخة سابقة فيها خلل)،
  // بتحويله لصيغة "يوم/شهر/سنة" الموحّدة. يعمل مرة عند كل فتح، بدون أي تدخل يدوي.
  function fixBadDates(){
    var changed = false;
    var cleanRe = /^\d{1,2}\/\d{1,2}\/\d{4}$/;
    allEntries.forEach(function(e){
      if(e.date && !cleanRe.test(e.date)){
        var d = new Date(e.date);
        if(!isNaN(d.getTime())){
          e.date = pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
          changed = true;
        }
      }
    });
    if(changed) persist();
  }

  function init(){
    setType('out');
    document.getElementById('dateInput').value = todayInputValue();

    allEntries   = safeGet(CACHE_KEY) || [];
    pendingQueue = safeGet(QUEUE_KEY) || [];
    deleteQueue  = safeGet(DELQ_KEY) || [];
    editQueue    = safeGet(EDITQ_KEY) || [];
    lastSyncAt   = safeGet(SYNC_KEY) || null;
    fixBadDates();
    renderAll();
    document.getElementById('versionFooter').textContent = 'الإصدار ' + APP_VERSION;

    if(APPS_SCRIPT_URL){
      trySync().then(pullFromSheet);
      setInterval(function(){ trySync().then(pullFromSheet); }, PULL_INTERVAL_MS);
    }
  }
  init();

  // شاشة دخول بسيطة بكلمة سر: تمنع أي حدا غير حميدا من فتح السجل لو وصل للرابط أو الجهاز.
  // تعمل محليًا بالكامل (بدون نت)، وتتذكر هذا الجهاز بعد أول دخول صحيح فلا تُطلب كل مرة.
  var LOCK_KEY = 'hamida_unlocked_v1';
  function tryUnlock(){
    var val = document.getElementById('lockInput').value.trim();
    if(SYNC_SECRET && val === SYNC_SECRET){
      try{ localStorage.setItem(LOCK_KEY, '1'); }catch(e){}
      document.getElementById('lockOverlay').hidden = true;
    } else {
      document.getElementById('lockMsg').hidden = false;
      document.getElementById('lockInput').value = '';
      document.getElementById('lockInput').focus();
    }
  }
  document.getElementById('lockBtn').addEventListener('click', tryUnlock);
  document.getElementById('lockInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') tryUnlock();
  });
  (function checkLock(){
    if(!SYNC_SECRET) return; // ما في كلمة سر معرّفة بعد: التطبيق يفتح مباشرة
    var alreadyUnlocked = false;
    try{ alreadyUnlocked = localStorage.getItem(LOCK_KEY) === '1'; }catch(e){}
    if(alreadyUnlocked) return; // فُتح على هذا الجهاز من قبل: لا نطلب كلمة السر مجددًا
    var overlay = document.getElementById('lockOverlay');
    overlay.hidden = false;
    document.getElementById('lockInput').focus();
  })();

  // تسجيل Service Worker حقيقي (يعمل هنا لأن الصفحة مستضافة خارج بيئة Claude):
  // يخزّن هيكل الصفحة بالكامل، فيفتح التطبيق ويعمل حتى بدون أي اتصال بالإنترنت من الأساس.
  // الإنترنت بعد ذلك مطلوب فقط لإرسال الحركات الجديدة إلى شيت جوجل (المزامنة).
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  // زر تثبيت صريح يظهر عند دعم المتصفح له (كروم على أندرويد مثلًا)؛ وإن لم يظهر،
  // التثبيت اليدوي من قائمة المتصفح (⋮ ثم "إضافة إلى الشاشة الرئيسية") يعمل بنفس الطريقة.
  var deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    document.getElementById('installBtn').hidden = false;
  });
  document.getElementById('installBtn').addEventListener('click', function(){
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function(){
      deferredInstallPrompt = null;
      document.getElementById('installBtn').hidden = true;
    });
  });
  window.addEventListener('appinstalled', function(){
    document.getElementById('installBtn').hidden = true;
  });
})();
</script>
</body>
</html>
